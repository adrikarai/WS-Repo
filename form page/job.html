<html>
    <head> <title>Job app form</title></head>
    <body>
        <div style="width: 500px; height: 1000px; background-color: lightcyan;">
            <form action="">
                <h3> JOB APPLICATION FORM </h3>
                 <div>
                    <label for="" style="color: mediumvioletred;"> First Name</label>
                    <br>
                    <input type="text" placeholder="Enter your First Name" required>
                </div>
                <br>
                 <div>
                    <label for="" style="color: darkblue;"> Last Name</label>
                    <br>
                    <input type="text" placeholder="Enter your Last Name" required>
                </div>
                <br>
                 <div>
                    <label for="" style="color: saddlebrown;">Email</label>
                    <br>
                    <input type="email" placeholder="Enter your Email">     
                 </div>
                 <br>
                  <div>
                    <label for="" style="color: darkblue;"> Mobile Number </label>
                    <br>
                    <input type="number" min="10" placeholder="012-345-6789">
                </div>
                <br>
                 <div>
                    <label for="" style="color: darkorchid;"> DOB </label>
                    <br>
                    <input type="date">
                </div>
                <br>
                 <div>
                    <label for="" style="color: darkolivegreen;"> State </label>
                    <select name="" id="">
                        <option value=""> Select Country </option>
                        <option value=""> Rajasthan </option>
                        <option value=""> Gujarat </option>
                        <option value=""> Bihar </option>
                        <option value=""> Uttar Pradesh </option>
                        <option value=""> Madhya Pradesh </option>
                    </select>
                </div>
                <br>
                 <div>
                    <label for="" style="color: firebrick;">Gender</label>
                    <input type="radio" value="male" name="Gender"/>Male
                    <input type="radio" value="female" name="Gender"/>Female
                     <input type="radio" value="other" name="Gender"/>Other
                </div>
                <br>
                <div>
                    <label for="" style="color: blueviolet;"> Address </label>
                    <br>
                    <textarea name="" id="" placeholder="message">address</textarea>
                </div>
                <br>
                <div>
                    <label for="" style="color: darkred;"> Q1ualification </label>
                    <br>
                    <input type="checkbox"value="10th"/> 10th
                    <input type="checkbox"value="12th"/> 12th
                    <input type="checkbox"value="under graduate"/> Under graduate
                    <input type="checkbox"value="post graduate"/> Post graduate
                </div>
                <br>
                 <div>
                    <label for="" style="color: darkmagenta;">Photo</label>
                    <br>
                    <input type="file">
                </div>
                <br>
                <div>
                    <button type="submit"> Save </button>
                    <button type="reset"> Reset </button>
                </div>
            </form>
        </div>
    </body>
</html>
