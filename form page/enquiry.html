<html>
    <head> <title> Enquiry Form</title></head>
    <body>
        <div style="width: 1000px;">
            <form>
                <div>
                    <label for="" style="color: mediumvioletred;">Name</label>
                    <br>
                    <input type="text" placeholder="Enter your Name" required>
                </div>
                <br>
                 <div>
                    <label for="" style="color: darkblue;">Gender</label>
                    <input type="radio" value="male" name="Gender"/>Male
                    <input type="radio" value="female" name="Gender"/>Female
                </div>
                <br>
                 <div>
                    <label for="" style="color: saddlebrown;">Email</label>
                    <br>
                    <input type="email" placeholder="Enter your Email">     
                 </div>
                 <br>
                  <div>
                    <label for="" style="color: darkgreen;">Password</label>
                    <br>
                    <input type="text" placeholder="Enter your Password" required>
                </div>
                <br>
                <div>
                    <label for="" style="color: darkred;"> Course</label>
                    <br>
                    <input type="checkbox"value="html"/> HTML
                    <input type="checkbox"value="css"/> CSS
                    <input type="checkbox"value="js"/> JS
                    <input type="checkbox"value="react"/> React
                </div>
                <br>
                <div>
                    <label for="" style="color: darkmagenta;">Photo</label>
                    <br>
                    <input type="file">
                </div>
                <br>
                <div>
                    <label for="" style="color: darkblue;"> Age </label>
                    <input type="number" min="12" max="25">
                </div>
                <br>
                <div>
                    <label for="" style="color: darkorchid;"> Date </label>
                    <br>
                    <input type="date">
                </div>
                <br>
                <div>
                     <label for="" style="color: darkslategrey;"> Month </label>
                     <br>
                    <input type="month">
                </div>
                <br>
                <div>
                     <label for="" style="color: darkorange;"> Time </label>
                     <br>
                    <input type="time">
                </div>
                <br>
                <div>
                    <label for="" style="color: darkolivegreen;"> Country </label>
                    <select name="" id="">
                        <option value=""> Select Country </option>
                        <option value=""> India </option>
                        <option value=""> Srilanka </option>
                        <option value=""> China </option>
                        <option value=""> Japan </option>
                        <option value=""> Singapor</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for=""> Color </label>
                    <input type="color">
                </div>
                <br>
                <div>
                    <label for="" style="color: firebrick;"> Range </label>
                    <input type="range" min="100" value="400" max="1000">
                </div>
                <br>
                 <div>
                    <button type="submit"> Save </button>
                    <button type="reset"> Reset </button>
                </div>
            </form>
        </div>
    </body>
</html>
